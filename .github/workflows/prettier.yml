name: Documentation formatting
on:
  push:
    branches: [main, dev]
  pull_request:
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --ignore-path /dev/null --check README.md README.fa.md package.json .github/workflows/build-zip.yml .github/workflows/e2e.yml .github/workflows/prettier.yml
