name: Extension and MCP regressions
on:
  push:
    branches: [main, dev]
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm ci --prefix companion
      - run: pnpm test:extension
      - run: MCP_TEST_RUNTIME="$PWD/companion" pnpm test:companion
