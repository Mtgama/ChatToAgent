<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>Mehrdad MCP</title><link rel="stylesheet" href="mehrdad-popup.css"><script src="mehrdad-popup.js" defer></script></head><body>
<header><img src="brand.svg" width="42" height="42" alt=""><div><h1>Mehrdad MCP</h1><small dir="ltr">mehrdad hasanzade</small></div><button id="theme" class="theme" type="button" aria-label="تغییر تم">☾</button><span>۰.۷.۲</span></header>
<main><p id="status" role="status">در حال بررسی اتصال…</p>
<form id="pair"><h2>اتصال به مدیریت محلی</h2><p>کلید را از بخش «اتصال افزونه» در برنامهٔ Mehrdad MCP کپی کن.</p><label for="token">کلید اتصال</label><input id="token" type="password" autocomplete="off" dir="ltr" required><button type="submit">اتصال</button></form>
<section id="controls" hidden><p id="tools-state"></p><h2>پوشهٔ پروژه</h2><form id="workspace-form"><label for="workspace">مسیر دسترسی ابزار فایل</label><input id="workspace" dir="ltr" required><div class="actions"><button id="browse" type="button" class="secondary">انتخاب پوشه</button><button type="submit">ذخیره و اعمال</button></div></form><p>این مسیر برای تمام مشتریان MCP اعمال می‌شود. سرویس پس از ذخیره دوباره راه‌اندازی می‌شود.</p><button id="open" class="secondary full">بازکردن پنل مدیریت و لاگ‌ها ↗</button></section>
<p id="message" role="alert"></p></main><footer>ابزارهای محلی، با کنترل شما.</footer></body></html>
